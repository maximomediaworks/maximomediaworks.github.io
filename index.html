<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maximo Media Works</title>
<meta name="description" content="Maximo Media Works. Built by hand.">
<meta property="og:title" content="Maximo Media Works">
<meta property="og:description" content="Built by hand. Opening soon.">
<meta property="og:image" content="https://maximomediaworks.com/last.jpg">
<style>
  html,body{margin:0;height:100%;background:#050b13;overflow:hidden}
  video,.still{position:fixed;left:0;right:0;bottom:0;top:4vh;width:100vw;height:96vh;object-fit:cover;object-position:50% 0%;background:#050b13}
  @media (max-aspect-ratio:4/3){video,.still{top:0;height:100vh;object-fit:contain;object-position:50% 50%}}
  .still{display:none}
  #info{position:fixed;left:0;right:0;bottom:7vh;text-align:center;color:#F6EFE3;
        font:400 clamp(15px,2.1vw,22px)/1.5 Georgia,"Times New Roman",serif;letter-spacing:.04em;
        opacity:0;transition:opacity 1.6s ease;pointer-events:none;padding:0 16px;text-shadow:0 1px 8px rgba(0,0,0,.7)}
  #info.on{opacity:1;pointer-events:auto}
  #info a{color:#E3AE72;text-decoration:none;border-bottom:1px solid rgba(227,174,114,.4)}
  #info .line{font-style:italic;margin-bottom:.35em}
  #again{position:fixed;right:18px;bottom:14px;background:none;border:0;color:rgba(246,239,227,.35);
         font:13px system-ui,sans-serif;cursor:pointer;opacity:0;transition:opacity .8s}
  #again.on{opacity:1}
  #again:hover{color:rgba(246,239,227,.75)}
  .go{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:none;background:rgba(0,0,0,.4);color:#F6EFE3;
      border:1px solid rgba(246,239,227,.6);border-radius:999px;padding:10px 22px;font:15px Georgia,serif;letter-spacing:.12em;cursor:pointer}
</style>
</head>
<body>
<video id="v" src="maximo-seal.mp4" muted playsinline autoplay preload="auto" aria-label="Bamboo chopsticks rise one by one off blue water into the Maximo seal and wordmark"></video>
<img class="still" id="still" src="last.jpg" alt="The Maximo seal and wordmark made of bamboo chopsticks over blue water">
<button class="go" id="go" type="button">Play</button>
<div id="info">
  <div class="line">Built by hand. Opening soon.</div>
  <a href="mailto:maximo@maximomediaworks.com">maximo@maximomediaworks.com</a>
</div>
<button id="again" type="button">Play again</button>
<script>
(()=>{
  const v=document.getElementById('v'), info=document.getElementById('info'), again=document.getElementById('again'), go=document.getElementById('go');
  const done=()=>{info.classList.add('on'); again.classList.add('on')};
  const play=()=>{info.classList.remove('on'); again.classList.remove('on'); go.style.display='none'; v.currentTime=0; const p=v.play(); if(p&&p.catch) p.catch(()=>{go.style.display='block'})};
  v.addEventListener('ended',done);
  again.onclick=play; go.onclick=play;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){v.removeAttribute('autoplay'); v.pause(); v.style.display='none'; document.getElementById('still').style.display='block'; done(); return}
  const p=v.play(); if(p&&p.catch) p.catch(()=>{go.style.display='block'});
})();
</script>
</body>
</html>
